[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eitherautomouse"
version = "0.1.0"
description = "Mouse-activated keyboard layer for mouse actions - combining EitherMouse and AutoMouse concepts"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "morganvenable"}
]
keywords = ["mouse", "keyboard", "accessibility", "input", "hid"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Utilities",
]
dependencies = [
    "pynput>=1.7.6",
    "hidapi>=0.14.0",
    "pystray>=0.19.5",
    "Pillow>=10.0.0",
    "PyYAML>=6.0",
    "keyboard>=0.13.5",
]

[project.scripts]
eitherautomouse = "eitherautomouse.main:main"

[project.gui-scripts]
eitherautomouse-gui = "eitherautomouse.main:main"

[project.urls]
Homepage = "https://github.com/morganvenable/eitherautomouse"
Repository = "https://github.com/morganvenable/eitherautomouse"
